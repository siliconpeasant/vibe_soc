# Grok-only MCP config for vibe_soc.
# DO NOT put these names in .mcp.json with a colon prefix — Grok rejects
# ":" in server names and ends up with tool_count=0.
#
# Scope:
#   - Read by Grok: ~/.grok/config.toml + <repo>/.grok/config.toml
#   - Codex still uses .codex/config.toml (short names: soc-build, ...)
#   - Claude still uses .mcp.json (silicon-crew:… keys) + .claude/settings
#
# Priority: this file > .mcp.json. Hyphen names here are the working ones.

[mcp_servers.silicon-crew-soc-build]
enabled = true
command = "/bin/sh"
args = ["scripts/mcp_python.sh", ".agents/skills/soc-build/mcp_server.py"]
cwd = "."
startup_timeout_sec = 120
tool_timeout_sec = 43200

[mcp_servers.silicon-crew-soc-integrate]
enabled = false
command = "/bin/sh"
args = ["scripts/mcp_python.sh", ".agents/skills/soc-integrate/mcp_server.py"]
cwd = "."
startup_timeout_sec = 120
tool_timeout_sec = 300

