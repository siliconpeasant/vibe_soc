name: auto-pr-automerge

on:
  push:
    branches:
      - "codex/**"
      - "feature/**"
      - "fix/**"
  workflow_dispatch:
    inputs:
      head_branch:
        description: "Branch to open as a PR"
        required: true
      base_branch:
        description: "Target branch"
        required: false
        default: "main"

permissions:
  # Retained as a fallback until the repository GitHub App credentials are
  # configured. Normal operation uses the short-lived App installation token.
  contents: write
  pull-requests: write

concurrency:
  group: auto-pr-automerge-${{ github.event_name == 'workflow_dispatch' && inputs.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  auto-pr:
    name: create PR and enable auto-merge
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.base_branch || github.event.repository.default_branch }}
      HEAD_BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.head_branch || github.ref_name }}

    steps:
      - name: Detect GitHub App credentials
        id: app-config
        shell: bash
        env:
          APP_CLIENT_ID: ${{ vars.PR_AUTOMATION_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.PR_AUTOMATION_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [[ -n "$APP_CLIENT_ID" && -n "$APP_PRIVATE_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ -z "$APP_CLIENT_ID" && -z "$APP_PRIVATE_KEY" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub App credentials are not configured; falling back to GITHUB_TOKEN. PR-triggered workflows may require manual approval."
          else
            echo "::error::Configure both PR_AUTOMATION_APP_CLIENT_ID and PR_AUTOMATION_APP_PRIVATE_KEY, or remove both to use the fallback."
            exit 1
          fi

      - name: Generate scoped GitHub App token
        if: steps.app-config.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PR_AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PR_AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update pull request
        id: pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = process.env.HEAD_BRANCH;
            const base = process.env.BASE_BRANCH;
            const trustedPrefixes = ['codex/', 'feature/', 'fix/'];

            if (head.includes(':') || !trustedPrefixes.some((prefix) => head.startsWith(prefix))) {
              core.setFailed([
                `Refusing untrusted head branch ${head}.`,
                `Allowed same-repository prefixes: ${trustedPrefixes.join(', ')}.`,
              ].join(' '));
              return;
            }

            if (head === base) {
              core.setFailed(`head branch ${head} is the same as base branch ${base}`);
              return;
            }

            const { data: closed } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'closed',
              head: `${owner}:${head}`,
              base,
              per_page: 100,
            });
            const merged = closed.find((pull) => pull.merged_at);
            if (merged) {
              core.setFailed([
                `Refusing to reuse branch ${head}: PR #${merged.number} already merged.`,
                'Create a fresh task branch from the latest base with',
                `scripts/prepare_task_branch.sh <task-slug>.`,
              ].join(' '));
              return;
            }

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
              per_page: 1,
            });

            let pull;
            if (existing.length > 0) {
              pull = existing[0];
              core.info(`Reusing PR #${pull.number}: ${pull.html_url}`);
            } else {
              const title = `[auto] ${head} -> ${base}`;
              const body = [
                `Auto-created from \`${head}\` to \`${base}\`.`,
                '',
                'CI runs on the branch or pull request checks. If repository auto-merge is enabled and required checks pass, GitHub will merge this PR automatically.',
              ].join('\n');
              const created = await github.rest.pulls.create({
                owner,
                repo,
                title,
                body,
                head,
                base,
                maintainer_can_modify: true,
              });
              pull = created.data;
              core.info(`Created PR #${pull.number}: ${pull.html_url}`);
            }

            core.setOutput('number', String(pull.number));
            core.setOutput('node_id', pull.node_id);
            core.setOutput('url', pull.html_url);

      - name: Enable auto-merge
        uses: actions/github-script@v7
        env:
          PULL_REQUEST_ID: ${{ steps.pr.outputs.node_id }}
        with:
          github-token: ${{ steps.app-token.outputs.token || github.token }}
          script: |
            const pullRequestId = process.env.PULL_REQUEST_ID;
            if (!pullRequestId) {
              core.setFailed('missing pull request node id');
              return;
            }

            const mutation = `
              mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number autoMergeRequest { enabledAt } }
                }
              }
            `;

            try {
              const result = await github.graphql(mutation, { pullRequestId });
              core.info(`Auto-merge enabled for PR #${result.enablePullRequestAutoMerge.pullRequest.number}`);
            } catch (error) {
              core.warning(`Could not enable auto-merge: ${error.message}`);
              core.warning('Check that repository Allow auto-merge is enabled and branch protection/required checks are configured.');
            }
