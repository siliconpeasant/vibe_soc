name: top-smoke

on:
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: "Simulation seed"
        required: false
        default: "1"
      use_prebuilt_simv:
        description: "Use chip/top prebuilt OpenTitan smoke simv"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: top-smoke-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  detect_smoke_need:
    name: detect chip/top smoke need
    runs-on: ubuntu-latest
    outputs:
      need_smoke: ${{ steps.detect.outputs.need_smoke }}
      changed_files: ${{ steps.detect.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect RTL-impacting changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          need_smoke=0
          changed_file="$(mktemp)"

          if [[ "$EVENT_NAME" == "workflow_dispatch" || "$EVENT_NAME" == "schedule" ]]; then
            need_smoke=1
            echo "manual or scheduled run" > "$changed_file"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            pr_number=""
            if command -v gh >/dev/null 2>&1; then
              pr_number=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/pulls" \
                -f state=open \
                -f head="${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}" \
                -f per_page=1 \
                --jq '.[0].number // ""')
            fi

            if [[ -n "$pr_number" ]]; then
              base_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.base.sha')
              head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" --jq '.head.sha')
              git diff --name-only "$base_sha" "$head_sha" > "$changed_file"
            elif [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
              need_smoke=1
              echo "new branch push" > "$changed_file"
            else
              git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" > "$changed_file"
            fi
          else
            need_smoke=1
            echo "event $EVENT_NAME" > "$changed_file"
          fi

          if [[ "$need_smoke" != "1" ]]; then
            while IFS= read -r path; do
              case "$path" in
                .github/workflows/top-smoke.yml|\
                Makefile|\
                scripts/common.mk|\
                scripts/config.mk|\
                scripts/paths.mk|\
                scripts/setup|\
                scripts/setup.sh|\
                scripts/setup.csh|\
                scripts/toolchains/*|\
                scripts/build_fingerprint.py|\
                scripts/validate_filelist.py|\
                scripts/run_regression.py|\
                chip/top/*|\
                ip/*)
                  need_smoke=1
                  break
                  ;;
              esac
            done < "$changed_file"
          fi

          echo "need_smoke=$need_smoke" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            sed -n '1,200p' "$changed_file"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "need_smoke=$need_smoke"
          echo "changed files:"
          sed -n '1,200p' "$changed_file"

  chip_top_smoke:
    name: chip/top UART smoke
    needs: detect_smoke_need
    if: needs.detect_smoke_need.outputs.need_smoke == '1'
    runs-on: [self-hosted, linux, eda, vcs]
    timeout-minutes: 90
    env:
      MODULE: chip/top
      SIMULATOR: vcs
      LINT_TOOL: none
      TEST: chip_sw_uart_smoketest
      SEED: ${{ inputs.seed || '1' }}
      FSDB: "0"
      OT_USE_PREBUILT_SIMV: ${{ inputs.use_prebuilt_simv && '1' || vars.OT_USE_PREBUILT_SIMV || '0' }}
      OT_SMOKE_PREBUILT_SIMV: ${{ vars.OT_SMOKE_PREBUILT_SIMV }}
      CI_SITE_ENV_SCRIPT: ${{ vars.CI_SITE_ENV_SCRIPT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Show runner context
        shell: bash
        run: |
          set -euo pipefail
          echo "runner=$(hostname)"
          echo "workspace=$GITHUB_WORKSPACE"
          echo "module=$MODULE test=$TEST seed=$SEED simulator=$SIMULATOR"
          echo "OT_USE_PREBUILT_SIMV=$OT_USE_PREBUILT_SIMV"

      - name: Check EDA environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CI_SITE_ENV_SCRIPT:-}" ]]; then
            test -f "$CI_SITE_ENV_SCRIPT"
            # shellcheck disable=SC1090
            source "$CI_SITE_ENV_SCRIPT"
          fi
          make check-env SIMULATOR="$SIMULATOR" LINT_TOOL="$LINT_TOOL"

      - name: Validate chip/top filelist
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CI_SITE_ENV_SCRIPT:-}" ]]; then
            # shellcheck disable=SC1090
            source "$CI_SITE_ENV_SCRIPT"
          fi
          make validate-flist MODULE="$MODULE" SIMULATOR="$SIMULATOR" TEST="$TEST"

      - name: Run chip/top smoke
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${CI_SITE_ENV_SCRIPT:-}" ]]; then
            # shellcheck disable=SC1090
            source "$CI_SITE_ENV_SCRIPT"
          fi
          simv_arg=()
          if [[ -n "${OT_SMOKE_PREBUILT_SIMV:-}" ]]; then
            simv_arg=(OT_SMOKE_PREBUILT_SIMV="$OT_SMOKE_PREBUILT_SIMV")
          fi
          make comp sim \
            MODULE="$MODULE" \
            SIMULATOR="$SIMULATOR" \
            TEST="$TEST" \
            SEED="$SEED" \
            FSDB="$FSDB" \
            OT_USE_PREBUILT_SIMV="$OT_USE_PREBUILT_SIMV" \
            "${simv_arg[@]}"

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip-top-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            chip/top/de/run/compile.log
            chip/top/de/run/rtl.f
            chip/top/dv/sim/chip_sw_uart_smoketest/compile.log
            chip/top/dv/sim/chip_sw_uart_smoketest/elab.log
            chip/top/dv/sim/chip_sw_uart_smoketest/sim.log
            chip/top/dv/sim/chip_sw_uart_smoketest/dut.f
            chip/top/dv/sim/chip_sw_uart_smoketest/dut.canonical.f
